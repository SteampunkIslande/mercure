<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Création d'utilisateur</title>
    <link rel="stylesheet" type="text/css" href="/static/styles/default.css">
</head>

<body>
    <div class="container">
        <h1>Administration - Création d'utilisateur</h1>
        <form id="registerForm">
            <div class="form-group">
                <label for="username">Nom d'utilisateur:</label>
                <input type="text" id="username" name="username" placeholder="Nom d'utilisateur" required>
            </div>
            <div class="form-group">
                <label for="email">Adresse e-mail:</label>
                <input type="email" id="email" name="email" placeholder="Adresse e-mail" required>
            </div>
            <div class="form-group">
                <label for="password">Mot de passe:</label>
                <input type="password" id="password" name="password" placeholder="Mot de passe" required>
            </div>
            <div class="error" id="error-message" style="display: none;"></div>
            <div class="success" id="success-message" style="display: none;"></div>
            <button type="submit" class="btn">Créer l'utilisateur</button>
            <a href="/mercure/admin/landing_page" class="btn btn-secondary">Retour au tableau de bord</a>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/mercure/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    errorDiv.style.display = 'none';
                    successDiv.style.display = 'block';
                    successDiv.textContent = 'Utilisateur créé avec succès';
                    document.getElementById('registerForm').reset();
                } else {
                    successDiv.style.display = 'none';
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = data.message || 'Erreur lors de la création';
                    setTimeout(() => {
                        errorDiv.style.display = 'none';
                    }, 2000);
                }
            } catch (error) {
                successDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Erreur de connexion au serveur';
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 2000);
            }
        });
    </script>
</body>

</html>
