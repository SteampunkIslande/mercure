<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Administration - Création d'utilisateur</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="/static/styles/default.css">
    <link rel="stylesheet" type="text/css" href="/static/icon-font/material-icons.css">
</head>

<body>
    <div class="banner">
        <div class="banner-content">
            <span class="banner-text">Administration - Création d'utilisateur</span>
            <div class="logout-button">
                <a href="/mercure/logout" class="btn btn-danger"><span class="material-icons icon-align">logout</span>Déconnexion</a>
            </div>
        </div>
    </div>
    <div class="container">
        <form id="registerForm">
            <div>
                <label for="username">Nom d'utilisateur:</label>
                <input type="text" id="username" name="username" placeholder="Nom d'utilisateur" autocomplete="off" required>
            </div>
            <div>
                <label for="usermail">Adresse e-mail:</label>
                <input type="email" id="usermail" name="usermail" placeholder="Adresse e-mail" autocomplete="off" required>
            </div>
            <div>
                <label for="password">Mot de passe:</label>
                <input type="password" id="password" name="password" placeholder="Mot de passe" autocomplete="off" required>
            </div>
            <div class="error" id="error-message" style="display: none;"></div>
            <div class="success" id="success-message" style="display: none;"></div>
            <button id="createUserButton" class="btn btn-primary">Créer l'utilisateur</button>
            <a href="/mercure/admin/dashboard" class="btn btn-secondary">Retour au tableau de bord</a>
        </form>
    </div>

    <script>
        document.getElementById('createUserButton').addEventListener('click', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            const usermail = document.getElementById('usermail').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/mercure/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ usermail, username, password })
                });

                const data = await response.json();

                if (data.success) {
                    errorDiv.style.display = 'none';
                    successDiv.style.display = 'block';
                    successDiv.textContent = 'Utilisateur créé avec succès';
                    setTimeout(() => {
                        successDiv.style.display = 'none';
                    }, 2000);
                    document.getElementById('registerForm').reset();
                } else {
                    successDiv.style.display = 'none';
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = data.message || 'Erreur lors de la création';
                    setTimeout(() => {
                        errorDiv.style.display = 'none';
                    }, 2000);
                }
            } catch (error) {
                successDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Erreur de connexion au serveur';
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 2000);
            }
        });

        function init() {
            document.getElementById('registerForm').reset();
        }

        window.onload = function () {
            init();
        };

    </script>
</body>

</html>
