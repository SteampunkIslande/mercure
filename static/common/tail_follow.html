<!DOCTYPE html>
<html>
<head>
  <style>
    .tail-follow-container {
      max-width: 400px;
      margin: 40px auto;
      padding: 24px 32px;
      background: #f8fafc;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .tail-follow-title {
      font-size: 1.2em;
      margin-bottom: 18px;
      color: #22223b;
      letter-spacing: 0.5px;
    }
    .tail-follow-progress {
      width: 100%;
      height: 28px;
      border-radius: 8px;
      background: #e0e7ef;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .tail-follow-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8 0%, #6366f1 100%);
      width: 0%;
      transition: width 0.3s cubic-bezier(.4,2,.6,1);
    }
    .tail-follow-percent {
      font-size: 1.1em;
      color: #3b3b3b;
      font-weight: 500;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="tail-follow-container">
    <div class="tail-follow-title">Live Progress</div>
    <div class="tail-follow-progress">
      <div class="tail-follow-progress-bar" id="tailFollowBar"></div>
    </div>
    <div class="tail-follow-percent" id="tailFollowPercent">0%</div>
  </div>
  <script>
    const bar = document.getElementById('tailFollowBar');
    const percentText = document.getElementById('tailFollowPercent');
    let lastPercent = 0;

    function setProgress(p) {
      bar.style.width = p + '%';
      percentText.textContent = p + '%';
    }

    async function followStream() {
      while (true) {
        try {
          const resp = await fetch('/static/test');
          if (!resp.body) throw new Error('No stream');
          const reader = resp.body.getReader();
          let decoder = new TextDecoder();
          let buffer = '';
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            // Find all percent matches, e.g. "42%"
            let matches = buffer.match(/(\d{1,3})%/g);
            if (matches && matches.length > 0) {
              let last = matches[matches.length - 1];
              let num = parseInt(last.replace('%',''), 10);
              if (!isNaN(num) && num >= 0 && num <= 100) {
                lastPercent = num;
                setProgress(num);
              }
            }
            // Optionally trim buffer to avoid memory leak
            if (buffer.length > 1000) buffer = buffer.slice(-1000);
          }
        } catch (e) {
          setProgress(0);
        }
        // Wait 2s before retrying on error or stream end
        await new Promise(r => setTimeout(r, 2000));
      }
    }

    setProgress(0);
    followStream();
  </script>
</body>
</html>
