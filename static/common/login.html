<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/static/styles/default.css">
    <title>Connexion - Mercure</title>
</head>

<body>
    <div class="container">
        <h1 class="title">Connexion</h1>
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" name="username" placeholder="Nom d'utilisateur" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Mot de passe" required>
            </div>
            <div class="error" id="error-message" style="display: none;"></div>
        </form>
        <a id="loginButton" class="btn btn-primary" onclick="onConnect()">Se connecter</a>
        <a href="/mercure" class="btn btn-secondary">Retour</a>
    </div>

    <script>
        async function onConnect() {
            const errorDiv = document.getElementById('error-message');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/mercure/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    window.location.href = response.url;
                } else {
                    const data = await response.json();
                    errorDiv.style.display = 'block';
                    errorDiv.textContent = data.message || 'Erreur de connexion';
                    setTimeout(() => {
                        errorDiv.style.display = 'none';
                    }, 2000);
                }
            } catch (error) {
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Erreur de connexion au serveur';
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 2000);
            }
        }
        window.onload = function () {
            document.getElementById('loginForm').reset();
        };
    </script>
</body>

</html>
