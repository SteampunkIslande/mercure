name: Manual Linux Build & Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Nom du tag pour la release (ex : v1.0.0). Laisser vide pour utiliser la version de Cargo.toml."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rocky Linux 9 provides glibc 2.34
          - container: "rockylinux:9"
            target: "x86_64-unknown-linux-gnu"
            suffix: "glibc-2.34"
            deps: "dnf install -y --allowerasing gcc gcc-c++ curl git make perl perl-FindBin perl-IPC-Cmd"
          # Ubuntu 22.04 provides glibc 2.35
          - container: "ubuntu:22.04"
            target: "x86_64-unknown-linux-gnu"
            suffix: "glibc-2.35"
            deps: "apt-get update && apt-get install -y build-essential curl git"
          # Ubuntu 24.04 provides glibc 2.39
          - container: "ubuntu:24.04"
            target: "x86_64-unknown-linux-gnu"
            suffix: "glibc-2.39"
            deps: "apt-get update && apt-get install -y build-essential curl git"
          # Ubuntu latest is fine for Musl cross-compilation
          - container: "ubuntu:latest"
            target: "x86_64-unknown-linux-musl"
            suffix: "musl"
            deps: "apt-get update && apt-get install -y build-essential curl git musl-tools"

    steps:
      - name: Install system dependencies
        run: ${{ matrix.deps }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Configure Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.suffix }}

      - name: Install mdbook
        run: cargo install mdbook

      - name: Build mdbook
        run: mdbook build documentation

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          # The resulting name will be e.g., smaug_x86_64_glibc-2.34
          cp target/${{ matrix.target }}/release/smaug target/${{ matrix.target }}/release/smaug_x86_64_${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: target/${{ matrix.target }}/release/smaug_x86_64_${{ matrix.suffix }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(awk '/^\[package\]/{p=1} p && /^version/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Read version from Cargo.toml: $VERSION"

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="v${{ steps.version.outputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Create and push tag
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries/
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: binaries/*
          draft: false
          prerelease: false