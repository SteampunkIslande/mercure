<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Landing Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 480px;
            margin: 60px auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            padding: 32px 24px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 16px;
        }

        .nav {
            margin-top: 32px;
        }

        .nav a {
            display: inline-block;
            padding: 12px 28px;
            background: #0078d4;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .nav a:hover {
            background: #005fa3;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome, Admin</h1>
        <p>Manage users and settings from this dashboard.</p>
        <div class="nav">
            <a href="/api/register">Create User</a>
        </div>
    </div>
</body>

</html>
