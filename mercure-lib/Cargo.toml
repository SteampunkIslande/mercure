[package]
name = "mercure-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5", features = ["secrets", "json"] }
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "time",
] }
bcrypt = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde"] }
thiserror = "1.0"
chrono = "0.4.42"
diacritics = "0.2.2"
intersection = "1.0.0"
anyhow = "1.0.100"
reqwest = { version = "0.12.24", features = ["native-tls-vendored"] }
lazy-regex = "3.4.2"
minijinja = "2.24.0"
rust-embed = "8.12.0"
log = "0.4.34"

[dev-dependencies]
