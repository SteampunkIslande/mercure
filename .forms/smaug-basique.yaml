name: "Smaug-v3 simple"
description: "Démultiplexe à partir d'un dossier de run brut, lance l'analyse smaug avec le BED spécifié, puis copie le résultat sur le NAS."
variables:
  - name: bed
    title: BED
    description: Le fichier BED à utiliser pour cette analyse
    type: FromURL
    source: /mercure/api/aux/list_beds
  - name: genome
    title: Génome
    description: Le génome à utiliser
    type: ValuesList
    values:
      - hg19
      - hg38
  - name: indir
    title: Dossier BCL
    description: Le dossier de run brut Illumina
    type: FromURL
    source: /mercure/api/aux/list_illumina_dirs
  - name: outdir
    title: Dossier de sortie
    description: Le dossier de travail pour snakemake
    type: LineEdit
  - name: panel
    title: Nom du panel
    description: "Le nom du panel"
    type: FromURL
    source: /mercure/api/aux/list_panels
  - name: sample_sheet
    title: SampleSheet
    description: La samplesheet, espèce de neuneu
    type: ExistingFile
# Workdir doit être un chemin relatif à la racine définie dans la config (/data/analysis par défaut)
# Dans workdir, se trouve toujours un dossier issu d'un git clone sur le dépôt configuré (pipelines par défaut)
workdir: outdir
groups:
  - Admin
  - Génétique
exec_type: shell
exec: |
  # Copie de la samplesheet dans le bon dossier
  rsync {{ sample_sheet }} {{ indir }}/SampleSheet.csv
  
  # Démultiplexage
  snakemake -s pipelines/demul/Snakefile --config indir={{ indir }} outdir={{ outdir }}
  
  # Copie vers MOABI 
  rsync -a --info=progress2 "{{ outdir }}/fastq" user@depot:/where/it/should/go
  
  # Smaug v3
  snakemake -s pipelines/smaug-v3/Snakefile --configfile pipelines/smaug-v3/config.yaml --config indir={{ outdir }} outdir={{ outdir }}/tentative-{{ attempt_id }}
  
  # Copie NAS
  rsync -a --info=progress2 "{{ outdir }}/{bam,vcf,reports}" /mnt/nas/analysis/{{ panel }}

