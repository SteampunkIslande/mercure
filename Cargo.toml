[package]
name = "mercure"
version = "0.1.0"
edition = "2024"

[dependencies]
rocket = { version = "0.5", features = ["secrets", "json"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "time"] }
bcrypt = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
time = { version = "0.3", features = ["serde"] }
thiserror = "1.0"
async-trait = "0.1"

[dev-dependencies]
rocket = { version = "0.5", features = ["secrets", "json"] }
