[package]
name = "mercure"
version = "0.1.0"
edition = "2024"

default-run = "mercure"

[dependencies]
mercure-lib = { path = "./mercure-lib" }
rocket = { version = "0.5", features = ["secrets", "json"] }
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "time",
] }
bcrypt = "0.15"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
clap = { version = "4.4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4.28"
env_logger = "0.11.8"
regex = "1.12.2"
anyhow = "1.0.104"
nix = { version = "0.31.3", features = ["signal"] }

[dev-dependencies]
rocket = { version = "0.5", features = ["secrets", "json"] }
